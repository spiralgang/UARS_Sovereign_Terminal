name: Android Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    # Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); setup-android@v3 failed on the removed 'tools' package.
    # gradlew is committed, so no wrapper generation is needed.
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: upload apk
      uses: actions/upload-artifact@v4
      with:
        name: UARS+
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
